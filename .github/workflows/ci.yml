name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Match the Debian base used by the development containers.
      image: debian:13.7@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The slim Debian image needs Git before checkout can fetch submodules.
      - name: Install verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make clang clang-format-19 clang-tidy cppcheck \
            lcov libclang-rt-dev lld llvm nodejs npm valgrind wabt

      - name: Check out source and Clay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check C formatting
        run: sh scripts/dev.sh format-check

      - name: Run all C static analyzers
        run: make -k -C src analyze

      - name: Run native unit and integration tests
        run: make -k -C src test-native test-native-valgrind test-native-sanitize

      - name: Build and validate release and debug WebAssembly
        run: |
          make -C src release debug validate
          wasm-validate src/build/debug/index.wasm

      - name: Install browser test dependencies
        run: |
          npm ci --prefix tests
          npm exec --prefix tests -- playwright-core install --with-deps --only-shell chromium

      - name: Run Chromium end-to-end test
        run: sh scripts/dev.sh test browser

      - name: Generate native and browser coverage
        run: sh scripts/dev.sh coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            src/build/coverage/lcov.info
            src/build/coverage/html/
          if-no-files-found: error
          retention-days: 14
